<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simbli V1</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="status">Ready</div>

    <!-- View 1: Upload/Start -->
    <div id="upload-view" class="view active">
        <h1>Simbli V1</h1>
        <div class="card">
            <h3>Start Project</h3>
            <input type="file" id="file-upload" accept="image/*">
            <p style="margin: 10px 0; color: #666;">or</p>
            <button class="text-btn" onclick="loadStock('gray')">Use Demo Image</button>
        </div>
    </div>

    <!-- View 2: Editor -->
    <div id="editor-view" class="view">
        <div id="toolbar">
            <button class="btn tool active" id="tool-select" onclick="window.setTool('select')"
                title="Select">SEL</button>
            <button class="btn tool" id="tool-text" onclick="window.setTool('text')" title="Text">TXT</button>
            <button class="btn tool" id="tool-lift" onclick="window.setTool('lift')" title="Lift">LFT</button>
            <button class="btn tool" id="tool-magic-remove" onclick="window.setTool('magic-remove')"
                title="Remove">RMV</button>
            <div class="sep"></div>
            <button class="btn" onclick="actions.undo()" title="Undo">↶</button>
            <button class="btn" onclick="actions.redo()" title="Redo">↷</button>
            <div class="sep"></div>
            <button class="btn" onclick="location.reload()" title="Exit">✖</button>
        </div>

        <div id="canvas-container">
            <canvas id="editor-canvas"></canvas>
        </div>

        <div id="sidebar">
            <h3>Layers</h3>
            <div id="layers-list"></div>

            <div id="text-controls"
                style="display:none; margin-top: 20px; border-top: 1px solid #444; padding-top:10px;">
                <h4>Text Options</h4>
                <div style="margin-bottom:8px">
                    <label>Size</label>
                    <input type="number" id="font-size" value="40" onchange="updateTextStyle()">
                </div>
                <div style="margin-bottom:8px">
                    <label>Color</label>
                    <input type="color" id="font-color" value="#ffffff" onchange="updateTextStyle()">
                </div>
                <button onclick="editSelectedText()">Edit Content</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>

</html>
